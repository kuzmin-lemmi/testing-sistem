<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%236366f1%27/%3E%3Cpath d=%27M9 9h14v3H9zm0 6h14v3H9zm0 6h9v3H9z%27 fill=%27white%27/%3E%3C/svg%3E">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

            max-width: 450px;
        }

        p { color: #64748b; font-size: 1.1em; line-height: 1.6; }
    </style>
</head>
<body data-watch="none">
    <div class="card">
        <div class="icon">⏳</div>
        <h1>Тестирование не запущено</h1>
        <p>Ничего нажимать не нужно: как только учитель запустит тестирование, откроется форма входа</p>
    </div>
    <script src="{{ url_for('static', filename='js/student_watch.js') }}"></script>
