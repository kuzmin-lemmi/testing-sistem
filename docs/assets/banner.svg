    <text x="62" y="351" font-size="15" fill="#a6b4d3">Локальная сеть</text>
    <circle cx="209" cy="346" r="2" fill="#6366f1"/>
    <text x="226" y="351" font-size="15" fill="#a6b4d3">Мониторинг класса</text>
    <circle cx="405" cy="346" r="2" fill="#6366f1"/>
    <text x="422" y="351" font-size="15" fill="#a6b4d3">Результаты</text>
    <g transform="translate(775 72)">
