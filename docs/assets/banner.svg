<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Система тестирования</title>
  <desc id="desc">От варианта до результата. Локальная сеть, мониторинг класса и результаты.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10162f"/><stop offset="1" stop-color="#24244d"/>
    </linearGradient>
    <linearGradient id="accent" x2="1" y2="1">
      <stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <circle cx="1150" cy="40" r="240" fill="#818cf8" opacity=".07"/>
  <circle cx="1210" cy="420" r="190" fill="#2dd4bf" opacity=".05"/>
  <g font-family="Segoe UI, Arial, sans-serif">
