      <text x="38" y="95" font-size="12" fill="#a6b4d3">ЗАДАНИЯ</text>
      <path d="m40 115 5 5 10-12" stroke="#5eead4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
