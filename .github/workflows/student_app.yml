name: Программа ученика

on:
  push:
    branches: [main]
    paths: ['student_app/**', '.github/workflows/student_app.yml']
  pull_request:
    paths: ['student_app/**', '.github/workflows/student_app.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: student_app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: student_app
      - run: cargo check --all-targets
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: Тестирование.exe
          path: student_app/target/release/student_app.exe
