<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка редактора Python</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family: Arial, sans-serif; margin: 24px; background: #f8fafc; color: #111827; }
  #editor { height: 320px; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; max-width: 800px; }
  #log { font-family: monospace; white-space: pre-wrap; margin-top: 12px; }
</style>
</head>
<body>
<!-- Открыть в браузере после «npm run build»: редактор, подсветка, F5 / Ctrl+Enter, Ctrl+F -->
<h3>Проверка редактора Python</h3>
<div id="editor"></div>
<div id="log"></div>
<script src="../../static/js/vendor/codemirror.min.js"></script>
<script>
  const log = text => { document.getElementById('log').textContent = text; };
  window.editor = TestingEditor.create(document.getElementById('editor'), {
    doc: [
      '# Задание 24: самая длинная цепочка из символов X',
      'def longest(s):',
      '    best = cur = 0',
      '    for c in s:',
      "        cur = cur + 1 if c == 'X' else 0",
      '        best = max(best, cur)',
      '    return best',
      '',
      "with open('24.txt') as f:",
      '    print(longest(f.read().strip()), len(range(10)), True, None)',
    ].join('\n'),
    placeholder: 'Пиши код здесь…',
    onChange: code => log(`Строк: ${code.split('\n').length}`),
    onRun: () => log('Запуск (F5 / Ctrl+Enter)'),
  });
</script>
</body>
</html>
